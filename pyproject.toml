[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eyd"
version = "0.1.0"
description = "EyD — thin runtime that signs agent actions and issues Proof Receipts"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = ["cryptography>=42"]

[project.optional-dependencies]
clearinghouse = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
eyd = "eyd.cli:main"

[tool.setuptools.packages.find]
include = ["eyd*", "verifier*", "clearinghouse_ref*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
